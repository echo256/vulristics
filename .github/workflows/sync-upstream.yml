name: Sync with Upstream

on:
  # Автоматический запуск каждую неделю в воскресенье в 2:00 UTC
  schedule:
    - cron: '0 2 * * 0'
  
  # Ручной запуск через интерфейс GitHub
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if conflicts exist'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/leonov-av/vulristics.git
          git fetch upstream

      - name: Sync main branch
        run: |
          git checkout main
          git merge upstream/main --no-edit
          
      - name: Push changes
        run: |
          git push origin main

      - name: Create Pull Request for develop branch
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-sync/upstream-updates
          title: 'Auto-sync: Merge upstream changes'
          body: |
            🤖 Автоматическое обновление с upstream репозитория
            
            Изменения из: https://github.com/leonov-av/vulristics
            
            Пожалуйста, проверьте изменения перед мержем в develop ветку.
          base: develop